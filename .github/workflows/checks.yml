name: Static game checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check game.js
      - run: node --test tests/smoke.test.js
      - run: test -s index.html && test -s styles.css && test -s manifest.webmanifest && test -s sw.js
